name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Git Bash is available on Windows runners. Explicit bash enables pipefail,
    # so tee records the output without hiding a failed npm command.
    shell: bash

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # T2 diagnostic only: compare Windows PowerShell Core without tee.
    # Restore the original workflow after collecting this run.
    defaults:
      run:
        shell: ${{ matrix.os == 'windows-latest' && 'pwsh' || 'bash' }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Install dependencies
        if: runner.os != 'Windows'
        run: |
          mkdir -p ci-logs
          npm --prefix core ci --ignore-scripts 2>&1 | tee ci-logs/install.log
      - name: Typecheck UI
        if: runner.os != 'Windows'
        run: npm --prefix core run typecheck:ui 2>&1 | tee ci-logs/typecheck.log
      - name: Check UI build
        if: runner.os != 'Windows'
        run: npm --prefix core run build:ui -- --check 2>&1 | tee ci-logs/build.log
      - name: Run tests
        if: runner.os != 'Windows'
        run: npm --prefix core test 2>&1 | tee ci-logs/test.log
      - name: Windows encoding environment (T2 diagnostic)
        if: runner.os == 'Windows'
        run: |
          [pscustomobject]@{parentOutput=[Console]::OutputEncoding.CodePage; parentInput=[Console]::InputEncoding.CodePage; psVersion=$PSVersionTable.PSVersion.ToString()} | ConvertTo-Json -Compress
          & powershell.exe -NoProfile -NonInteractive -Command '[pscustomobject]@{output=[Console]::OutputEncoding.CodePage; input=[Console]::InputEncoding.CodePage; pipeline=$OutputEncoding.CodePage; ansi=[Text.Encoding]::Default.CodePage; psVersion=$PSVersionTable.PSVersion.ToString()} | ConvertTo-Json -Compress'
      - name: Install dependencies (Windows, no tee)
        if: runner.os == 'Windows'
        run: npm --prefix core ci --ignore-scripts
      - name: Typecheck UI (Windows, no tee)
        if: runner.os == 'Windows'
        run: npm --prefix core run typecheck:ui
      - name: Check UI build (Windows, no tee)
        if: runner.os == 'Windows'
        run: npm --prefix core run build:ui -- --check
      - name: Run tests (Windows, no tee)
        if: runner.os == 'Windows'
        run: npm --prefix core test
      - name: Upload failure logs
        if: failure() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.os }}-${{ github.run_attempt }}
          path: ci-logs/*.log
          retention-days: 7

  performance:
    name: Performance (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          npm --prefix core ci --ignore-scripts 2>&1 | tee ci-logs/install.log
      - name: Run performance tests
        run: npm --prefix core run test:perf 2>&1 | tee ci-logs/performance.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-performance-${{ github.run_attempt }}
          path: ci-logs/*.log
          retention-days: 7
