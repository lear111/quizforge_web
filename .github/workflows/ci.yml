name: CI

on:
  # Files under core/docs are copied into the package but never read by code or tests. A change touching
  # only these paths skips CI; any other changed file runs everything.
  pull_request:
    paths-ignore:
      - 'core/docs/**'
      - 'CONTRIBUTING.md'
  push:
    branches: [main, v2]
    paths-ignore:
      - 'core/docs/**'
      - 'CONTRIBUTING.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    # Git Bash is available on Windows runners. Explicit bash enables pipefail,
    # so tee records the output without hiding a failed npm command.
    shell: bash

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          npm --prefix core ci --ignore-scripts 2>&1 | tee ci-logs/install.log
      - name: Typecheck UI
        run: npm --prefix core run typecheck:ui 2>&1 | tee ci-logs/typecheck.log
      - name: Typecheck V2 server
        run: npm --prefix core run typecheck:server 2>&1 | tee ci-logs/typecheck-server.log
      - name: Check UI build
        run: npm --prefix core run build:ui -- --check 2>&1 | tee ci-logs/build.log
      - name: Run tests
        run: npm --prefix core test 2>&1 | tee ci-logs/test.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ matrix.os }}-${{ github.run_attempt }}
          path: ci-logs/*.log
          retention-days: 7

  performance:
    name: Performance (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          npm --prefix core ci --ignore-scripts 2>&1 | tee ci-logs/install.log
      - name: Run performance tests
        run: npm --prefix core run test:perf 2>&1 | tee ci-logs/performance.log
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-performance-${{ github.run_attempt }}
          path: ci-logs/*.log
          retention-days: 7

  code-quality:
    name: V2 code quality (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Install dependencies
        run: |
          mkdir -p ci-logs
          npm --prefix core ci --ignore-scripts 2>&1 | tee ci-logs/quality-install.log
      - name: Check formatting and lint
        run: |
          # Run both checks and retain their real exit codes; neither failure is hidden.
          set +e
          npm --prefix core run format:check 2>&1 | tee ci-logs/format.log
          format_status=${PIPESTATUS[0]}
          npm --prefix core run lint 2>&1 | tee ci-logs/lint.log
          lint_status=${PIPESTATUS[0]}
          if [ "$format_status" -ne 0 ] || [ "$lint_status" -ne 0 ]; then exit 1; fi
      - name: Upload quality failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-code-quality-${{ github.run_attempt }}
          path: ci-logs/*.log
          retention-days: 7

  browser:
    name: V2 browser checks (ubuntu-latest)
    # V1 does not ship the V2 probes. Test PRs targeting V2 and pushes to V2.
    if: github.base_ref == 'v2' || github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: core/package-lock.json
      - name: Install dependencies
        run: |
          mkdir -p .temp/ci-browser
          npm --prefix core ci --ignore-scripts 2>&1 | tee .temp/ci-browser/dependencies.log
      - name: Install Playwright and Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/qf-playwright" --no-save --ignore-scripts playwright@1.65.0 \
            2>&1 | tee .temp/ci-browser/playwright.log
          node "$RUNNER_TEMP/qf-playwright/node_modules/playwright/cli.js" install --with-deps --no-shell chromium \
            2>&1 | tee .temp/ci-browser/chromium.log
      - name: Build UI
        run: npm --prefix core run build:ui 2>&1 | tee .temp/ci-browser/build.log
      - name: Run all ten browser probes once
        run: |
          failed=0
          for probe in page page-contract grading page-review practice save-recovery whiteboard basic-types completion router; do
            echo "::group::$probe"
            if ! QF_BROWSER_FAILURE_DIR="$PWD/.temp/ci-browser/$probe" \
                node "core/scripts/dev/probe-v2-$probe.mjs" \
                "$RUNNER_TEMP/qf-playwright/node_modules/playwright/index.mjs" chromium \
                2>&1 | tee ".temp/ci-browser/$probe.log"; then
              echo "::error title=Browser probe failed::$probe"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Upload browser failure logs and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-browser-${{ github.run_attempt }}
          path: |
            .temp/ci-browser/
            .temp/v2-*/**/*.png
          include-hidden-files: true
          retention-days: 7
