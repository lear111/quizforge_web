.ink-layer{position:absolute;inset:0;z-index:3;touch-action:none;pointer-events:none;width:100%;height:100%}.workspace.drafting .ink-layer{pointer-events:auto;cursor:crosshair}.workspace.drafting.hand .ink-layer{pointer-events:none}.workspace.drafting .question-card{outline:2px dashed #BFB6EE;outline-offset:6px}.whiteboard-toolbar{position:absolute;z-index:8;display:flex;align-items:center;gap:2px;padding:6px;border:1px solid #EBE7F1;border-radius:23px;background:#fff;box-shadow:0 10px 28px -6px rgba(43,32,64,.15),0 2px 6px rgba(43,32,64,.10);user-select:none;touch-action:none;color:#4B4458}.whiteboard-toolbar.vertical{flex-direction:column}.whiteboard-toolbar.horizontal{flex-direction:row}.whiteboard-toolbar button{display:grid;place-items:center;position:relative;width:34px;height:34px;border:0;background:transparent;border-radius:10px;padding:0;color:inherit}.whiteboard-toolbar button.active{background:#EDE7FA;color:#6A4FC0}.whiteboard-toolbar button:disabled{opacity:.32}.whiteboard-toolbar .sep{background:#ECE8F2;flex:none}.whiteboard-toolbar.vertical .sep{width:60%;height:1px;margin:3px 0}.whiteboard-toolbar.horizontal .sep{height:60%;width:1px;margin:0 3px}.whiteboard-toolbar .dot{position:absolute;right:5px;bottom:5px;width:7px;height:7px;border-radius:50%;border:1.5px solid #fff}.whiteboard-pop{position:absolute;z-index:9;display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid #EBE7F1;border-radius:14px;background:#fff;box-shadow:0 10px 28px -6px rgba(43,32,64,.18);font-size:13px;color:#4B4458;width:180px}.color-row{display:flex;gap:8px}.color-swatch{width:26px;height:26px;border-radius:50%;padding:0;border:2px solid transparent}.color-swatch.active{box-shadow:0 0 0 2px var(--qf-accent);border-color:white}.width-row{display:flex;gap:6px}.width-option{width:44px;height:32px;border:1px solid #EBE7F1;border-radius:8px;background:white;display:grid;place-items:center}.width-option.active{border-color:var(--qf-accent);background:#EDE7FA}.toast{p /* Mobile overlay: cover the entire screen, including the top toolbar. */
@media (max-width:900px) {
  .sidebar {
    top:0;
    bottom:0;
    z-index:30;
    height:100%;
    box-shadow:0 12px 32px rgba(20,22,40,.18);
  }
  .scrim.visible {
    inset:0;
    z-index:25;
    touch-action:none;
  }
}
/* At phone widths, reserve an independent bottom navigation strip. */
@media (max-width:600px) {
  .workspace::after {
    content:'';
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:calc(76px + env(safe-area-inset-bottom, 0px));
    z-index:4;
    background:#fff;
    border-top:1px solid var(--qf-border);
    pointer-events:none;
  }
  .workspace .scroller {
    padding:16px 16px calc(104px + env(safe-area-inset-bottom, 0px));
  }
  .workspace .sidenav {
    top:auto;
    bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    transform:none;
    width:48px;
    height:52px;
    border-radius:14px;
    z-index:5;
  }
  .workspace .sidenav.left {left:16px;}
  .workspace .sidenav.right {right:16px;}
}

/* Drawer motion: preserve the original layout and move only the opening panels. */
:root { --qf-drawer-ease:cubic-bezier(.22,1,.36,1); }
.bank-viewport { display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows 300ms var(--qf-drawer-ease),opacity 220ms ease; }
.bank-viewport.open { grid-template-rows:1fr; opacity:1; }
.bank-clip { min-height:0; overflow:hidden; }
.bank-viewport .bank-items { padding-top:2px; margin-top:0; }
@media (min-width:901px) {
  .sidebar { min-width:0; transition:width 320ms var(--qf-drawer-ease),opacity 240ms ease; }
  .sidebar.closed { display:flex; width:0!important; overflow:hidden; border-color:transparent; opacity:0; pointer-events:none; }
}
@media (max-width:900px) {
  .app .sidebar { display:flex!important; visibility:hidden; pointer-events:none; transform:translate3d(-104%,0,0); transition:transform 340ms var(--qf-drawer-ease),visibility 0s linear 340ms; }
  .app .sidebar.outline { transform:translate3d(104%,0,0); }
  .app .sidebar.mobile-open { transform:translate3d(0,0,0); visibility:visible; pointer-events:auto; transition:transform 340ms var(--qf-drawer-ease),visibility 0s linear 0s; }
  .app.full .sidebar { display:none!important; }
  .app .scrim { display:block; position:absolute; inset:0; z-index:25; opacity:0; visibility:hidden; pointer-events:none; transition:opacity 280ms ease,visibility 0s linear 280ms; }
  .app .scrim.visible { display:block; opacity:1; visibility:visible; pointer-events:auto; transition:opacity 280ms ease,visibility 0s linear 0s; }
}
@media (prefers-reduced-motion:reduce) {
  .sidebar,.scrim,.bank-viewport,.group-btn .chevron { transition:none!important; }
}

</style>

<body>
<div class="app" id="app">
  <div class="scrim" id="scrim" data-action="close-drawer"></div>
  <aside class="sidebar library" id="library"><div class="grip" id="lib-grip" tabindex="0" role="separator" aria-label="拖动改变题库栏宽度，双击恢复默认" aria-orientation="vertical"></div>
    <div class="brand"><div class="brand-mark" id="brand-mark"></div><div><div class="brand-title">QuizForge</div><div class="brand-sub">你的练习空间</div></div></div>
    <div class="library-subhead"><span class="small-heading">我的题库</span><button class="icon-btn" aria-label="导入题库（原型）" data-action="placeholder" data-placeholder="导入题库功能将在第 6 阶段实现" id="import-btn"></button><button class="icon-btn" aria-label="新建题库（原型）" data-action="placeholder" data-placeholder="新建题库功能将在第 6 阶段实现" id="add-btn"></button><button class="icon-btn" aria-label="刷新题库列表（演示）" data-action="refresh-library" id="refresh-btn"></button></div>
    <nav class="library-nav" id="library-nav"></nav>
    <div class="library-foot"><button class="foot-btn" aria-label="设置（原型）" data-action="placeholder" data-placeholder="设置页面将在第 5 阶段实现" id="settings-btn"></button><a href="#" data-action="placeholder" data-placeholder="获取题库是预留入口">获取题库</a></div>
  </aside>
  <main class="main"><header class="topbar"><button class="desktop-btn" aria-label="收起或展开题库栏" data-action="toggle-lib" id="toggle-lib"></button><div class="top-title"><small id="group-name">考研英语</small><strong id="top-title">2004年考研英语真题</strong></div><span class="exam-pill" id="exam-pill" hidden></span><button class="top-action" id="draft-btn" data-action="draft"></button><button class="top-action" id="exam-btn" data-action="exam"></button><button class="desktop-btn" aria-label="收起或展开大纲栏" data-action="toggle-outline" id="toggle-outline"></button></header>
    <div class="workspace" id="workspace"><div class="scroller" id="scroller"><div id="page" style="display:flex;flex:1;flex-direction:column"></div></div><canvas class="ink-layer" id="ink"></canvas><button class="sidenav left" id="prev-btn" data-action="prev" aria-label="上一题" title="上一题"></button><button class="sidenav right" id="next-btn" data-action="next" aria-label="下一题" title="下一题"></button><div id="whiteboard-container"></div><div class="toast" id="toast"></div></div>
  </main>
  <aside class="sidebar outline" id="outline"><div class="grip" id="outline-grip" tabindex="0" role="separator" aria-label="拖动改变大纲栏宽度，双击恢复默认" aria-orientation="vertical"></div><div class="outline-head"><strong>题目大纲</strong><span class="outline-count" id="outline-count"></span></div><div class="outline-content" id="outline-content"></div><div class="outline-legend" id="outline-legend"></div></aside>
</div>
<script>

ink.addEventListener('pointerdown',e=>{if(!s.drafting||s.tool==='hand'||s.tool==='lasso')return;if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();ink.setPointerCapture(e.pointerId);const p=point(e);if(s.tool==='eraser'){erasing=true;eraseAt(p);return}drawing={color:s.ink,width:s.penWidth,points:[p]};currentInk().push(drawing);s.redo[s.current]=[];drawInk()});ink.addEventListener('pointermove',e=>{if(drawing){drawing.points.push(point(e));drawInk()}else if(erasing)eraseAt(point(e))});function endInk(){const wasDrawing=!!drawing;drawing=null;erasing=false;if(wasDrawing)renderWhiteboard()}ink.addEventListener('pointerup',endInk);ink.addEventListener('pointercancel',endInk);
let draggingToolbar=null;
document.addEventListener('pointerdown',e=>{const tb=e.target.closest('#wb-toolbar');if(!tb||!s.drafting||e.button!==0)return;const rect=tb.getBoundingClientRect();draggingToolbar={x:e.clientX,y:e.clientY,origX:parseFloat(tb.style.left),origY:parseFloat(tb.style.top),moved:false,el:tb}});
document.addEventListener('pointermove',e=>{if(!draggingToolbar)return;const dt=draggingToolbar;const dx=e.clientX-dt.x,dy=e.clientY-dt.y;if(!dt.moved&&Math.hypot(dx,dy)<6)return;dt.moved=true;dt.el.style.left=dt.origX+dx+'px';dt.el.style.top=dt.origY+dy+'px'});
document.addEventListener('pointerup',e=>{if(!draggingToolbar)return;const dt=draggingToolbar;if(dt.moved){const w=$('workspace').clientWidth,h=$('workspace').clientHeight;const centerX=dt.origX+(e.clientX-dt.x)+dt.el.offsetWidth/2,centerY=dt.origY+(e.clientY-dt.y)+dt.el.offsetHeight/2;const anchors={ 'top-left':[0,0],top:[.5,0],'top-right':[1,0],left:[0,.5],right:[1,.5],'bottom-left':[0,1],bottom:[.5,1],'bottom-right':[1,1]};s.dock=Object.entries(anchors).sort((a,b)=>Math.hypot(a[1][0]-centerX/w,a[1][1]-centerY/h)-Math.hypot(b[1][0]-centerX/w,b[1][1]-centerY/h))[0][0];s.cornerOpen=false;s.palette=null;renderWhiteboard()}draggingToolbar=null});
window.addEventListener('resize',()=>{if(!matchMedia('(max-width:900px)').matches&&s.drawer){s.drawer=null;render()}else{renderTop();renderWhiteboard();drawInk()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&s.drawer){s.drawer=null;render();return}if(e.target.matches('input,textarea'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();action(e.shiftKey?'redo':'undo',{});return}if(!s.drafting)return;const keys={p:'pen-tool',v:'hand-tool',h:'hand-tool',e:'eraser-tool',s:'lasso-tool'};if(keys[e.key.toLowerCase()]&&!e.ctrlKey&&!e.altKey){action(keys[e.key.toLowerCase()],{});return}if(e.key==='Escape'&&s.palette){s.palette=null;renderWhiteboard()}});
$('brand-mark').innerHTML=icon('logo',18);$('import-btn').innerHTML=icon('down',16);$('add-btn').innerHTML=icon('plus',16);$('refresh-btn').innerHTML=icon('refresh',16);$('settings-btn').innerHTML=icon('gear',17);$('toggle-lib').innerHTML=icon('panelLeft');$('toggle-outline').innerHTML=icon('panelRight');
render();
