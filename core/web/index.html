<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>QuizForge · 题库</title>
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/svg+xml" href="/assets/quizforge-icon.svg" sizes="any">
  <link rel="apple-touch-icon" href="/assets/quizforge-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="/shell/app.css">
  <link rel="stylesheet" href="/editor/editor-navigation.css">
  <link rel="stylesheet" href="/draft/whiteboard.css">
  <link rel="stylesheet" href="/draft/camera.css">
  <link rel="stylesheet" href="/shell/refinements.css">
  <link rel="stylesheet" href="/practice/practice-summary.css">
  <link rel="stylesheet" href="/shell/network-settings.css">
  <link rel="stylesheet" href="/ai/ai-settings.css">
  <link rel="stylesheet" href="/shell/admin-contact.css">
  <link rel="stylesheet" href="/development/development.css">
  <link rel="stylesheet" href="/library/library-management.css">
  <link rel="stylesheet" href="/exam/exam-mode.css">
  <link rel="stylesheet" href="/shell/themes.css">
  <link rel="stylesheet" href="/listening/audio-player.css">
  <link rel="stylesheet" href="/listening/listening.css">
  <link rel="stylesheet" href="/ai/ai-chat.css">
</head>

<body>
  <div class="app-shell">
    <aside class="library" aria-label="题库与拓展">
      <div id="library-resize" class="library-resize-handle" role="separator" tabindex="0" aria-label="调整题库列表宽度"
        aria-orientation="vertical" aria-controls="library-list" title="拖动调整宽度，双击恢复默认；方向键也可调整" hidden></div>
      <div class="brand"><img class="brand-mark" src="/assets/quizforge-icon.svg" width="36" height="36" alt=""
          aria-hidden="true"><span>QuizForge<small>你的练习空间</small></span></div>
      <div class="library-switch" hidden role="tablist" aria-label="切换列表"><button id="show-banks" role="tab"
          aria-selected="true">题库</button><button id="show-extensions" role="tab" aria-selected="false">拓展</button>
      </div>
      <div class="library-heading"><span id="library-label">我的题库</span>
        <div class="sidebar-actions"><button id="library-import" class="icon-button" title="导入题库分组" aria-label="导入题库分组"
            hidden><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5" />
            </svg></button><input id="library-import-file" type="file" accept=".qbank,application/vnd.quizforge.qbank"
            hidden><button id="library-new-group" class="icon-button" title="新建分组" aria-label="新建分组"
            hidden>+</button><button id="refresh" class="icon-button" title="刷新目录" aria-label="刷新目录">↻</button></div>
      </div>
      <div id="library-list" class="library-list"></div>
      <div class="library-footer"><button id="network-settings-open" class="icon-button network-settings-entry"
          aria-label="设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="m10 3-.7 2.2-2 .9-2.1-.5-2 3.4 1.5 1.7v2.6l-1.5 1.7 2 3.4 2.1-.5 2 .9.7 2.2h4l.7-2.2 2-.9 2.1.5 2-3.4-1.5-1.7v-2.6l1.5-1.7-2-3.4-2.1.5-2-.9L14 3Z" />
            <circle cx="12" cy="12" r="3" />
          </svg></button><a id="library-download" class="library-download-link"
          href="https://quizforge.treenewbee.cloud/manage/#library" target="_blank" rel="noopener noreferrer"
          title="在新标签页打开题库广场" aria-label="获取题库，在新标签页打开题库广场">获取题库<span aria-hidden="true">↗</span></a></div>
    </aside>
    <main class="main">
      <section class="document-header"><button id="library-toggle" class="icon-button sidebar-toggle"
          aria-label="隐藏文件列表" title="隐藏文件列表" aria-controls="library-list" aria-expanded="true"><svg viewBox="0 0 24 24"
            aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M9 4v16" />
          </svg></button>
        <div class="document-identity"><span id="document-group" class="document-group" hidden></span>
          <h1 id="document-title">选择一本题库</h1>
        </div><span id="development-badge" class="development-badge" hidden></span>
        <div class="document-actions"><span id="save-state" class="save-state" role="status"
            aria-live="polite"></span><button id="history-open" class="header-action" hidden title="历史记录"
            aria-label="历史记录"><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 11a9 9 0 1 1 3 7M3 4v7h7M12 7v5l3 2" />
            </svg></button><button id="edit-open" class="header-action" hidden title="编辑本题" aria-label="编辑本题"><svg
              viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 4 5 5-11 11H4v-5L15 4Zm-3 3 5 5" />
            </svg></button><button id="development-publish-open" class="development-preview-return"
            hidden>发布正式版</button><button id="development-edit" class="header-action" hidden title="预览编辑页面"
            aria-label="预览编辑页面"><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 4 5 5-11 11H4v-5L15 4Zm-3 3 5 5" />
            </svg></button><button id="development-return" class="development-preview-return"
            hidden>返回样例</button><button id="draft-toggle" class="draft-toggle" hidden
            aria-pressed="false"><span>✎</span> 草稿</button></div><button id="outline-toggle"
          class="icon-button sidebar-toggle" aria-label="隐藏大纲与 AI" title="隐藏大纲与 AI" aria-controls="right-sidebar"
          aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M15 4v16" />
          </svg></button>
      </section>
      <div id="mode-bar" class="mode-bar" hidden></div>
      <div id="notice" class="notice" role="alert" hidden></div>
      <div id="save-recovery" class="save-recovery" hidden><span id="recovery-message"></span>
        <div><button id="retry-save">重试保存</button><button id="load-saved">读取已保存内容</button></div>
      </div>
      <div id="panes" class="panes">
        <div id="collection-loading" class="collection-loading" role="status" aria-live="polite" aria-atomic="true" hidden>
          <span class="collection-loading-spinner" aria-hidden="true"></span>
          <strong>加载中…</strong>
          <span class="collection-loading-title"></span>
          <small class="collection-loading-detail"></small>
        </div>
        <div id="welcome" class="welcome"><span class="welcome-icon">▤</span>
          <h2>从一道题开始</h2>
          <p>选择左侧题库，开始练习。</p>
        </div>
        <nav class="question-navigation" aria-label="切换题目"><button id="previous" class="question-arrow previous"
            title="上一题" aria-label="上一题" disabled><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m14 5-7 7 7 7" />
            </svg></button><button id="next" class="question-arrow next" title="下一题" aria-label="下一题" disabled><svg
              viewBox="0 0 24 24" aria-hidden="true">
              <path d="m10 5 7 7-7 7" />
            </svg></button></nav>
      </div>
      <span id="progress-text" class="visually-hidden" aria-live="polite"></span>
    </main>
    <aside id="right-sidebar" class="outline" aria-label="大纲与 AI">
      <div id="outline-resize" class="outline-resize-handle" role="separator" tabindex="0" aria-label="调整大纲与 AI 侧栏宽度"
        aria-orientation="vertical" aria-controls="right-sidebar" title="左右拖动调整宽度，双击恢复默认" hidden></div>
      <div class="outline-heading" role="tablist" aria-label="侧栏内容">
        <button id="outline-tab" class="sidebar-tab" type="button" role="tab" aria-selected="true" aria-controls="outline-panel">题目大纲</button>
        <button id="ai-chat-tab" class="sidebar-tab" type="button" role="tab" aria-selected="false" aria-controls="ai-chat-panel" tabindex="-1">AI 对话</button>
      </div>
      <section id="outline-panel" class="outline-panel" role="tabpanel" aria-labelledby="outline-tab">
        <nav id="outline-list" class="outline-list"></nav>
        <div class="outline-legend"><span><i class="legend-dot draft"></i>已作答</span><span><i
              class="legend-dot correct"></i>答对</span><span><i class="legend-dot incorrect"></i>待巩固</span></div>
      </section>
      <section id="ai-chat-panel" class="ai-chat-panel" role="tabpanel" aria-labelledby="ai-chat-tab" hidden>
        <div id="ai-chat-root" class="ai-chat-root"><p class="ai-chat-empty">正在加载对话…</p></div>
      </section>
    </aside>
  </div>
  <div id="scrim" class="scrim" hidden></div>
  <dialog id="library-import-dialog" class="library-manage-dialog" aria-labelledby="library-import-title">
    <form id="library-import-form">
      <div class="dialog-heading">
        <h2 id="library-import-title">导入题库分组</h2><button id="library-import-close" class="icon-button" type="button"
          aria-label="关闭导入">×</button>
      </div>
      <p id="library-import-name" class="library-manage-hint"></p>
      <p class="library-manage-hint">导入新版 .qbank 及配套拓展：单题库放到题库根目录，分组包按组添加。每次创建独立副本，重名自动加序号。已有题库、作答和历史保留。旧格式包请联系制作者升级后导入。</p>
      <p id="library-import-error" class="library-manage-error" role="alert" hidden></p>
      <div class="dialog-actions"><button id="library-import-cancel" type="button">取消</button><button
          id="library-import-confirm" type="submit">导入</button></div>
    </form>
  </dialog>
  <dialog id="library-manage-dialog" class="library-manage-dialog" aria-labelledby="library-manage-title">
    <div id="library-manage-root"></div>
  </dialog>
  <dialog id="editor-leave-dialog" class="editor-leave-dialog" aria-labelledby="editor-leave-title">
    <div id="editor-leave-root"></div>
  </dialog>
  <dialog id="history-dialog" class="history-dialog" aria-labelledby="history-title">
    <div id="history-root"></div>
  </dialog>
  <dialog id="history-delete-dialog" class="history-delete-dialog" aria-labelledby="history-delete-title">
    <div id="history-confirm-root"></div>
  </dialog>
  <dialog id="network-settings-dialog" class="network-settings-dialog" aria-labelledby="network-settings-title">
    <div class="dialog-heading">
      <h2 id="network-settings-title">设置</h2><button id="network-settings-close" class="icon-button"
        aria-label="关闭设置">×</button>
    </div>
    <nav class="settings-tabs" role="tablist" aria-label="设置分类"><button id="settings-network-tab" role="tab"
        aria-selected="true" type="button">网络连接</button><button id="settings-ai-tab" role="tab" aria-selected="false"
        type="button">AI 评分</button><button id="settings-user-tab" role="tab" aria-selected="false"
        type="button">用户中心</button><button id="settings-development-tab" role="tab" aria-selected="false"
        type="button">拓展管理</button><button id="settings-appearance-tab" role="tab" aria-selected="false"
        type="button">外观</button></nav>
    <form id="network-settings-form"><div id="network-settings-root"></div></form>
    <section id="ai-settings-panel" hidden>
      <form id="ai-settings-form" class="ai-settings-form">
        <div id="ai-settings-root"></div>
      </form>
    </section>
    <section id="user-center-panel" class="user-center" hidden>
      <div id="user-center-root"></div>
    </section>
    <section id="development-settings-panel" hidden>
      <form id="development-settings-form" class="development-settings-form">
        <div id="development-settings-root" style="display:contents"></div>
      </form>
    </section>
    <section id="appearance-settings-panel" class="appearance-settings" hidden>
      <div id="appearance-settings-root"></div>
    </section>
  </dialog>
  <dialog id="admin-contact-dialog" class="admin-contact-dialog" aria-labelledby="admin-contact-title">
    <div class="admin-contact-heading"><h2 id="admin-contact-title">联系管理员</h2><button id="admin-contact-close" class="admin-contact-close" type="button" aria-label="关闭联系管理员">×</button></div>
    <p id="admin-contact-status" class="admin-contact-status" role="status"></p>
    <div id="admin-contact-content" class="admin-contact-content" hidden></div>
    <div class="dialog-actions"><button id="admin-contact-retry" type="button" hidden>重新读取</button><button id="admin-contact-done" type="button">关闭</button></div>
  </dialog>
  <dialog id="hub-login-dialog" class="hub-login-dialog" aria-labelledby="hub-login-title">
    <h2 id="hub-login-title">登录 QuizForge 账号</h2>
    <p id="hub-login-message">已在浏览器打开登录页，在那里点“允许”后，这里会自动关闭。</p>
    <p class="hub-login-wait" role="status" id="hub-login-wait">等待登录…</p>
    <p class="hub-login-manual">没有弹出？<a id="hub-login-link" target="_blank" rel="noopener">手动打开登录页</a></p>
    <div class="dialog-actions"><button id="hub-login-cancel" type="button">取消</button></div>
  </dialog>
  <dialog id="development-publish-dialog" class="development-publish-dialog"
    aria-labelledby="development-publish-title">
    <h2 id="development-publish-title">发布正式拓展</h2>
    <p id="development-publish-status" role="status"></p>
    <p id="development-publish-identity"></p><code id="development-publish-target"></code>
    <p id="development-publish-error" role="alert" hidden></p>
    <div class="dialog-actions"><button id="development-publish-cancel" type="button">取消</button><button
        id="development-publish-confirm" type="button" disabled>生成正式版本</button></div>
  </dialog>
  <dialog id="access-dialog">
    <form method="dialog" id="access-form">
      <h2>连接 QuizForge</h2>
      <p>请输入这台电脑设置的连接密码。</p><label>密码或访问口令<input id="access-token" type="password" autocomplete="current-password"
          required></label>
      <p id="access-error" class="access-error"></p><button type="submit">连接</button>
    </form>
  </dialog>
  <script src="/listening/audio-player.js"></script>
  <script src="/ui/quizforge-ui.js"></script>
  <script type="module" src="/app.js"></script>
</body>

</html>
