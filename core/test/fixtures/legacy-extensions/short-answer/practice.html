<article class="question-card" lang="zh-CN" aria-labelledby="question-title"><header class="card-header"><div class="eyebrow"><span class="type-badge">简答</span><span id="score-hint" class="muted"></span></div><h1 id="question-title">简答练习</h1><p class="intro">写下你的理解，提交后对照参考答案评分。</p></header><div class="question-body"><div id="stem"></div><h2 class="field-title">你的答案</h2><div id="answer-host"></div></div><section id="result-panel" class="result-panel" hidden><div class="result-summary"><h2>作答结果</h2><span id="result-score"></span></div><div class="reference-block"><h3>参考答案</h3><div id="reference-answer"></div></div><div class="reference-block"><h3>评分说明</h3><div id="rubric"></div></div><div id="review-panel" class="review-panel"><label for="review-score">对照参考答案评分</label><div class="score-control"><input id="review-score" type="range" min="0" max="5" step="0.5" value="0"><output id="review-value" for="review-score">0 分</output><button id="review-confirm" class="secondary-button" type="button">确认评分</button></div><p>以 0.5 分为单位，结束本轮前可以重新确认分数。</p></div></section><footer class="card-footer"><div><span id="progress-label" class="progress-label">待作答</span><p id="save-notice" class="save-notice" role="status" aria-live="polite"></p></div><div class="actions"><button id="submit-button" class="primary-button" type="button">提交答案</button><button id="retry-button" class="primary-button" type="button" hidden>再答一次</button></div></footer></article>
