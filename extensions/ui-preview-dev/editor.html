<article class="question-card">
  <header class="card-heading"><span class="type-badge">单选</span><h2>编辑题目</h2></header>
  <section class="card-content editor-fields">
    <label>题干<textarea rows="2">缓存如何提高效率？</textarea></label>
    <label>说明<textarea rows="3">访问过的内容保存在本地后，下一次读取可以减少等待。下面哪种做法更合理？</textarea></label>
    <label>选项 A<input value="所有内容一直缓存，永不更新"></label>
    <label>选项 B<input value="复用有效缓存，内容变化时更新"></label>
    <label>选项 C<input value="每次操作都清空缓存"></label>
    <label>正确答案<select><option>A</option><option selected>B</option><option>C</option></select></label>
    <label>解析<textarea rows="3">缓存减少重复读取；内容发生变化时应更新缓存。</textarea></label>
  </section>
  <footer class="card-footer"><span>编辑界面示例</span></footer>
</article>
